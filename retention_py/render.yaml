services:
  - type: web
    name: safedata
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: TRUSTED_PROXIES
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MAX_REQUEST_BODY_SIZE
        value: "26214400"
