{% extends "layout.html" %}

{% block content %}
<div class="mb-3">
  <a href="/integrations/mappings" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left me-1"></i> Back to Field Mappings</a>
  <h1 class="h4 mt-1">{{ page_title }}</h1>
</div>

<div class="card shadow-sm" style="max-width: 600px;">
  <div class="card-body">
    <form method="post" action="/integrations/mappings/create">
      {{ csrf_field | safe }}
      <div class="mb-3">
        <label class="form-label fw-semibold">System <span class="text-danger">*</span></label>
        <select name="system_id" class="form-select" required>
          {% for s in systems %}
            <option value="{{ s.id }}">{{ s.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">External Object Type <span class="text-danger">*</span></label>
        <input type="text" name="external_object_type" class="form-control" required placeholder="e.g. customer / loan_application">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Target ADRS Category <span class="text-danger">*</span></label>
        <select name="category_id" class="form-select" required>
          {% for c in categories %}
            <option value="{{ c.id }}">{{ c.name }} ({{ c.compliance_framework }})</option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">External Field Name <span class="text-danger">*</span></label>
        <input type="text" name="external_field" class="form-control" required placeholder="e.g. customer_id / account_no">
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">ADRS Field</label>
        <select name="adrs_field" class="form-select">
          <option value="record_reference">record_reference</option>
          <option value="data_subject_type">data_subject_type</option>
          <option value="collection_date">collection_date</option>
          <option value="notes">notes</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Transformation (Optional)</label>
        <input type="text" name="transform" class="form-control" placeholder="e.g. UPPER({value})">
      </div>

      <div class="d-flex gap-2 pt-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Save Mapping</button>
        <a href="/integrations/mappings" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
