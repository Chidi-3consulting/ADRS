{% extends "layout.html" %}
{% block content %}
<div class="card shadow-sm mb-4" style="max-width: 820px;">
  <div class="card-body">
    <h1 class="h4 mb-3 fw-bold text-dark">Edit Data Category Policy: {{ category.name }}</h1>
    <form method="POST" action="/categories/edit/{{ category.id }}">
      {{ csrf_field | safe }}
      <div class="mb-3">
        <label class="form-label">Category Name *</label>
        <input type="text" name="name" class="form-control" required value="{{ category.name }}">
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="2">{{ category.description }}</textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Retention Reason / Lawful Purpose *</label>
        <textarea name="retention_reason" class="form-control" rows="2" required>{{ category.retention_reason }}</textarea>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Legal Basis *</label>
          <select name="legal_basis" class="form-select" required>
            <option value="legal_obligation" {{ 'selected' if category.legal_basis == 'legal_obligation' else '' }}>Legal Obligation</option>
            <option value="contract" {{ 'selected' if category.legal_basis == 'contract' else '' }}>Performance of Contract</option>
            <option value="consent" {{ 'selected' if category.legal_basis == 'consent' else '' }}>Consent of Subject</option>
            <option value="legitimate_interest" {{ 'selected' if category.legal_basis == 'legitimate_interest' else '' }}>Legitimate Interest</option>
            <option value="vital_interest" {{ 'selected' if category.legal_basis == 'vital_interest' else '' }}>Vital Interest</option>
            <option value="public_task" {{ 'selected' if category.legal_basis == 'public_task' else '' }}>Public Task</option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Disposal Trigger *</label>
          <select name="disposal_trigger" id="trigger" class="form-select" required>
            <option value="date_based" {{ 'selected' if category.disposal_trigger == 'date_based' else '' }}>📅 Date-based — dispose after a fixed period</option>
            <option value="consent_withdrawal" {{ 'selected' if category.disposal_trigger == 'consent_withdrawal' else '' }}>👤 Consent withdrawal — dispose after grace period</option>
          </select>
        </div>
      </div>

      <div id="retentionBlock" class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Retention Period (Days)</label>
          <input type="number" name="retention_period_days" class="form-control" value="{{ category.retention_period_days }}">
        </div>
        <div class="col-md-8 mb-3">
          <label class="form-label">Retention period label</label>
          <input type="text" name="retention_period_label" class="form-control" value="{{ category.retention_period_label }}">
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Disposal Method *</label>
          <select name="disposal_method" class="form-select" required>
            <option value="delete" {{ 'selected' if category.disposal_method == 'delete' else '' }}>Secure Delete (Complete Purge)</option>
            <option value="anonymise" {{ 'selected' if category.disposal_method == 'anonymise' else '' }}>Anonymise (Mask Personal Fields)</option>
            <option value="archive" {{ 'selected' if category.disposal_method == 'archive' else '' }}>Archive (Offline Backup)</option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Review Frequency *</label>
          <select name="review_frequency" class="form-select" required>
            <option value="monthly" {{ 'selected' if category.review_frequency == 'monthly' else '' }}>Monthly Review</option>
            <option value="quarterly" {{ 'selected' if category.review_frequency == 'quarterly' else '' }}>Quarterly Review</option>
            <option value="annually" {{ 'selected' if category.review_frequency == 'annually' else '' }}>Annual Review</option>
          </select>
        </div>
      </div>

      <div class="form-check mb-4 mt-2">
        <input class="form-check-input" type="checkbox" name="requires_dual_approval" id="requires_dual_approval" {{ 'checked' if category.requires_dual_approval else '' }}>
        <label class="form-check-label fw-bold text-dark" for="requires_dual_approval">
          Enable Dual-Signature Approval Safeguard
        </label>
        <div class="small text-muted">If checked, records under this category can never be auto-disposed by the scheduler. A DPO and Admin must both explicitly sign off.</div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary px-4">Save Policy Changes</button>
        <a href="/categories" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
