{% extends "public_layout.html" %}
{% block content %}
<main class="auth-page flex-grow-1 d-flex align-items-center justify-content-center py-5">
  <div class="auth-card card border-0 p-4 text-white" style="max-width: 440px;">
    <div class="text-center mb-4">
      <div class="auth-logo mb-3">
        <img src="/static/brand/safedata-mark-dark.svg" alt="" width="52" height="52">
      </div>
      <h1 class="h3 fw-bold mb-1">Two-Factor Authentication</h1>
      <p class="small" style="color: var(--sd-gray-400);">Enter the 6-digit verification code from your authenticator app, or an emergency recovery code.</p>
    </div>

    {% if error %}
      <div class="alert alert-danger small py-2 mb-3" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
      </div>
    {% endif %}

    <form method="POST" action="/login/2fa">
      {{ csrf_field | safe }}
      <div class="mb-4">
        <label class="form-label small fw-semibold text-center d-block">Verification Code</label>
        <input type="text" name="code" class="form-control auth-input text-center font-mono py-2 fs-4" placeholder="000000" required autocomplete="one-time-code" autofocus style="letter-spacing: 0.25em;">
      </div>
      <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold">Verify &amp; Sign In</button>
    </form>
    
    <div class="text-center mt-4 pt-3" style="border-top: 1px solid var(--sd-dark-border);">
      <a href="/logout" class="small text-decoration-none" style="color: var(--sd-warning);">Cancel and return to sign in &rarr;</a>
    </div>
  </div>
</main>

<style>
  .auth-page {
    background: var(--sd-dark-bg);
    min-height: 80vh;
    position: relative;
  }
  .auth-page::before {
    content: '';
    position: absolute;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    width: 500px;
    height: 500px;
    pointer-events: none;
  }
  .auth-card {
    width: 100%;
    max-width: 440px;
    background: var(--sd-dark-surface);
    border: 1px solid var(--sd-dark-border) !important;
    border-radius: var(--sd-radius-2xl);
    box-shadow: var(--sd-shadow-xl);
    animation: fadeInUp var(--sd-duration-slow) var(--sd-ease-out);
    position: relative;
    z-index: 1;
  }
  .auth-logo {
    width: 56px;
    height: 56px;
    border-radius: var(--sd-radius-xl);
    background: rgba(var(--sd-primary-rgb), 0.1);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
</style>
{% endblock %}
