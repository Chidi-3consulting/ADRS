{% extends "public_layout.html" %}

{% block content %}
<main class="flex-grow-1 d-flex align-items-center justify-content-center" style="min-height: 60vh;">
  <div class="text-center animate-in" style="max-width: 440px;">
    <div style="font-size: 5rem; font-family: var(--font-headings); font-weight: 800; color: var(--sd-gray-700); letter-spacing: -0.04em; line-height: 1;">404</div>
    <h2 class="mt-3 mb-2" style="color: var(--sd-gray-300);">Page Not Found</h2>
    <p class="mb-4" style="color: var(--sd-gray-500); font-size: var(--sd-text-sm); line-height: var(--sd-leading-relaxed);">
      The page or resource you requested could not be found. It may have been moved or deleted.
    </p>
    <div class="d-flex justify-content-center gap-3">
      <a href="/dashboard" class="btn btn-primary px-4">Go to Dashboard</a>
      <a href="/" class="btn btn-outline-light px-4">Back to Home</a>
    </div>
  </div>
</main>
{% endblock %}
