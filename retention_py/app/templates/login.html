{% extends "public_layout.html" %}
{% block content %}
<main class="auth-page flex-grow-1 d-flex align-items-center justify-content-center py-5">
  <div class="auth-card card border-0 p-4 text-white">
    <div class="text-center mb-4">
      <div class="auth-logo mb-3">
        <img src="/static/brand/safedata-mark-dark.svg" alt="" width="52" height="52">
      </div>
      <h1 class="h3 fw-bold mb-1">Sign In to SafeData</h1>
      <p class="small" style="color: var(--sd-gray-400);">Access your dashboard and manage retention schedules</p>
    </div>

    {% if flash_error %}
    <div class="alert alert-danger small py-2 mb-3" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ flash_error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
      {{ csrf_field | safe }}
      <div class="mb-3">
        <label class="form-label small fw-semibold">Email address</label>
        <input type="email" name="email" class="form-control auth-input py-2" required placeholder="name@company.com" autocomplete="email">
      </div>

      <div class="mb-4">
        <div class="d-flex justify-content-between mb-1">
          <label class="form-label small fw-semibold mb-0">Password</label>
          <a href="/forgot-password" class="small text-primary text-decoration-none">Forgot password?</a>
        </div>
        <input type="password" name="password" class="form-control auth-input py-2" required placeholder="••••••••" autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold">Sign In</button>
    </form>

    <div class="text-center mt-4 pt-3" style="border-top: 1px solid var(--sd-dark-border);">
      <p class="small mb-0" style="color: var(--sd-gray-400);">New to SafeData? <a href="/register" class="text-primary text-decoration-none fw-semibold">Start free trial &rarr;</a></p>
    </div>
  </div>
</main>

<style>
  .auth-page {
    background: var(--sd-dark-bg);
    min-height: 80vh;
    position: relative;
  }
  .auth-page::before {
    content: '';
    position: absolute;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(var(--sd-primary-rgb), 0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .auth-card {
    width: 100%;
    max-width: 440px;
    background: var(--sd-dark-surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--sd-dark-border) !important;
    border-radius: var(--sd-radius-2xl);
    box-shadow: var(--sd-shadow-xl);
    animation: fadeInUp var(--sd-duration-slow) var(--sd-ease-out);
    position: relative;
    z-index: 1;
  }
  .auth-logo {
    width: 56px;
    height: 56px;
    border-radius: var(--sd-radius-xl);
    background: rgba(var(--sd-primary-rgb), 0.1);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
</style>
{% endblock %}
