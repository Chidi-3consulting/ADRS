{% extends "layout.html" %}
{% block content %}
<div class="container-fluid px-0" style="max-width: 760px;">

  <div class="d-flex align-items-center gap-2 mb-4">
    <a href="/records/view/{{ record.id }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back to Record</a>
    <h1 class="h3 mb-0 fw-bold text-dark">Edit Record: {{ record.record_reference }}</h1>
  </div>

  <div class="card shadow-sm border-0 rounded-4 bg-white">
    <div class="card-body p-4 p-md-5">
      <form method="post" action="/records/edit/{{ record.id }}">
        {{ csrf_field | safe }}

        <div class="mb-3">
          <label class="form-label small fw-bold text-muted">Record Reference / Identifier *</label>
          <input type="text" name="record_reference" class="form-control" value="{{ record.record_reference }}" required>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label small fw-bold text-muted">Data Subject Type</label>
            <input type="text" name="data_subject_type" class="form-control" value="{{ record.data_subject_type or '' }}" placeholder="e.g. Customer, Employee, Vendor">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-bold text-muted">Collection Date *</label>
            <input type="date" name="collection_date" class="form-control" value="{{ record.collection_date }}" required>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label small fw-bold text-muted">Third-Party Processor Name</label>
            <input type="text" name="processor_name" class="form-control" value="{{ record.processor_name or '' }}" placeholder="e.g. AWS, Salesforce">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-bold text-muted">Processor Sync Status</label>
            <select name="processor_sync_status" class="form-select">
              <option value="synced" {{ 'selected' if record.processor_sync_status == 'synced' else '' }}>Synced</option>
              <option value="pending" {{ 'selected' if record.processor_sync_status == 'pending' else '' }}>Pending Sync</option>
              <option value="failed" {{ 'selected' if record.processor_sync_status == 'failed' else '' }}>Sync Failed</option>
            </select>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-bold text-muted">Notes</label>
          <textarea name="notes" class="form-control" rows="3" placeholder="Context notes...">{{ record.notes or '' }}</textarea>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary px-4">Save Changes</button>
          <a href="/records/view/{{ record.id }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>

</div>
{% endblock %}
