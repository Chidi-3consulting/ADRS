{% extends "layout.html" %}
{% block content %}
<div class="card shadow-sm" style="max-width: 820px;">
  <div class="card-body">
    <h1 class="h4 mb-3 fw-bold text-dark">Create Data Category Policy</h1>
    <form method="POST" action="/categories/create">
      {{ csrf_field | safe }}
      <div class="mb-3">
        <label class="form-label">Category Name *</label>
        <input type="text" name="name" class="form-control" required placeholder="e.g. Employee Contracts">
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="2" placeholder="Describe the type of data stored..."></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Retention Reason / Lawful Purpose *</label>
        <textarea name="retention_reason" class="form-control" rows="2" required placeholder="e.g. Required for tax audits, post-employment litigation defense"></textarea>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Legal Basis *</label>
          <select name="legal_basis" class="form-select" required>
            <option value="legal_obligation">Legal Obligation</option>
            <option value="contract">Performance of Contract</option>
            <option value="consent">Consent of Subject</option>
            <option value="legitimate_interest">Legitimate Interest</option>
            <option value="vital_interest">Vital Interest</option>
            <option value="public_task">Public Task</option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Disposal Trigger *</label>
          <select name="disposal_trigger" id="trigger" class="form-select" required>
            <option value="date_based">📅 Date-based — dispose after a fixed period</option>
            <option value="consent_withdrawal">👤 Consent withdrawal — dispose after grace period</option>
          </select>
        </div>
      </div>

      <div id="retentionBlock" class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Retention Period (Days)</label>
          <input type="number" name="retention_period_days" class="form-control" value="0">
        </div>
        <div class="col-md-8 mb-3">
          <label class="form-label">Retention period label</label>
          <input type="text" name="retention_period_label" class="form-control" placeholder="e.g. 7 years">
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Disposal Method *</label>
          <select name="disposal_method" class="form-select" required>
            <option value="delete">Secure Delete (Complete Purge)</option>
            <option value="anonymise">Anonymise (Mask Personal Fields)</option>
            <option value="archive">Archive (Offline Backup)</option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Review Frequency *</label>
          <select name="review_frequency" class="form-select" required>
            <option value="monthly">Monthly Review</option>
            <option value="quarterly" selected>Quarterly Review</option>
            <option value="annually">Annual Review</option>
          </select>
        </div>
      </div>

      <div class="form-check mb-4 mt-2">
        <input class="form-check-input" type="checkbox" name="requires_dual_approval" id="requires_dual_approval">
        <label class="form-check-label fw-bold text-dark" for="requires_dual_approval">
          Enable Dual-Signature Approval Safeguard
        </label>
        <div class="small text-muted">If checked, records under this category can never be auto-disposed by the scheduler. A DPO and Admin must both explicitly sign off.</div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary px-4">Create Policy Category</button>
        <a href="/categories" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
