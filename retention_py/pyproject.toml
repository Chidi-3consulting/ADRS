[tool.ruff]
line-length = 120
target-version = "py312"
include = ["app/core/**/*.py", "app/worker/**/*.py", "app/cli.py", "tests/test_foundation_*.py", "../tools/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
